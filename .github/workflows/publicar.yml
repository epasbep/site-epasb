# Compila o site React e publica-o no GitHub Pages sempre que há um push para o main.
# Requer: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar-site
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Enquanto o Pages estiver em "Deploy from a branch", o GitHub publica também os ficheiros
      # em bruto a cada push. Esta espera garante que a versão compilada é a última a entrar.
      # Pode ser removida depois de mudar Settings → Pages → Source para "GitHub Actions".
      - name: Esperar pela publicação automática do GitHub
        if: github.event_name == 'push'
        run: sleep 150
      - id: deploy
        uses: actions/deploy-pages@v4
