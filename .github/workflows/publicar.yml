# Compila o site React e publica-o:
#   1. no GitHub Pages (sempre);
#   2. no alojamento do epasb.ao por FTP (só depois de configurar os segredos — ver supabase/LEIA-ME.md).
# Corre a cada push para o main e também de hora a hora, para criar as páginas de partilha
# das notícias publicadas pelo painel entretanto.
# O Pages está configurado com Source: "GitHub Actions" (Settings → Pages).
name: Publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar-site
  cancel-in-progress: true

jobs:
  github-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://epasbep.github.io/site-epasb/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

  epasb-ao:
    runs-on: ubuntu-latest
    env:
      FTP_SERVIDOR: ${{ secrets.FTP_SERVIDOR }}
    steps:
      - name: Verificar configuração do FTP
        id: ftp
        run: |
          if [ -z "$FTP_SERVIDOR" ]; then
            echo "Segredos do FTP ainda não configurados: o epasb.ao não é actualizado."
            echo "configurado=nao" >> "$GITHUB_OUTPUT"
          else
            echo "configurado=sim" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ftp.outputs.configurado == 'sim'
        uses: actions/checkout@v4
      - if: steps.ftp.outputs.configurado == 'sim'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.ftp.outputs.configurado == 'sim'
        run: npm ci && npm run build
        env:
          SITE_URL: https://www.epasb.ao/
      - if: steps.ftp.outputs.configurado == 'sim'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVIDOR }}
          username: ${{ secrets.FTP_UTILIZADOR }}
          password: ${{ secrets.FTP_PALAVRA_PASSE }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_PASTA || 'public_html/' }}
