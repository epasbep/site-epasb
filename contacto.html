<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Contacte a EPASB-EP: envie um pedido, reclamação, denúncia ou sugestão, ou fale connosco por telefone e WhatsApp.">

<meta name="referrer" content="strict-origin-when-cross-origin">

<meta property="og:type" content="website">
<meta property="og:site_name" content="EPASB-EP">
<meta property="og:title" content="Atendimento ao Cidadão | EPASB-EP">
<meta property="og:description" content="Contacte a EPASB-EP: envie um pedido, reclamação, denúncia ou sugestão, ou fale connosco por telefone e WhatsApp.">
<meta property="og:url" content="https://www.epasb.ao/contacto.html">
<meta property="og:image" content="https://www.epasb.ao/assets/img/partilha.jpg">

<meta name="theme-color" content="#004B70">

<link rel="apple-touch-icon" href="assets/logo/icone-gota-180.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" defer></script>
</head>
<body data-pagina="contacto">
<main id="conteudo">
  <section class="hero hero--simples">
    <div class="container hero__dentro">
      <div class="hero__texto">
        <p class="eyebrow">Atendimento ao cidadão</p>
        <h1 class="h1">Fale connosco</h1>
        <p class="lead">Para formalizar uma solicitação, um esclarecimento, uma denúncia ou uma sugestão, preencha o formulário. Se for urgente, ligue ou escreva pelo WhatsApp.</p>
      </div>
    </div>
  </section>
  <section class="container seccao">
    <div class="admin__colunas">
      <form class="form" id="form-atendimento" novalidate>
        <div class="campo"><label for="nome">Nome *</label>
          <input class="input" id="nome" name="nome" autocomplete="name" required><p class="campo__erro" data-erro="nome"></p></div>
        <div class="campo"><label for="email">Email *</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" inputmode="email" required><p class="campo__erro" data-erro="email"></p></div>
        <div class="campo"><label for="telefone">Telefone</label>
          <input class="input" id="telefone" name="telefone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+244 9XX XXX XXX"></div>
        <div class="campo"><label for="assunto">Assunto *</label>
          <select class="select" id="assunto" name="assunto" required>
            <option value="">Seleccione um assunto</option><option>Elogio</option><option>Solicitação</option><option>Denúncia</option><option>Sugestão</option>
          </select><p class="campo__erro" data-erro="assunto"></p></div>
        <div class="campo"><label for="mensagem">Mensagem *</label>
          <textarea class="textarea" id="mensagem" name="mensagem" rows="6" required></textarea><p class="campo__erro" data-erro="mensagem"></p></div>
        <div class="campo"><span class="campo__label" id="l-doc">Anexar documento (opcional)</span>
          <p class="campo__ajuda">PDF, JPG ou PNG, até 5 MB.</p>
          <label class="ficheiro"><span id="doc-nome">Escolher ficheiro</span><input class="sr" id="documento" name="documento" type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" aria-labelledby="l-doc"></label>
          <p class="campo__erro" data-erro="documento"></p></div>
        <div class="mensagem" id="resultado" role="status"></div>
        <div class="form__accoes"><button class="btn btn--primario" id="enviar" type="submit">Enviar solicitação</button></div>
      </form>
      <aside class="admin__previa" aria-labelledby="t-cont">
        <div class="caixa">
          <h2 class="h3" id="t-cont">Outros contactos</h2>
          <dl class="contactos" id="contactos"></dl>
        </div>
      </aside>
    </div>
  </section>
</main>
<script type="module" src="js/layout.js"></script>
<script type="module" src="js/contacto.js"></script>
</body>
</html>
